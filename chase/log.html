<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Page</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
    }

    body {
        background-color: #f3f3f3;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        background: #fff;
        padding: 50px 40px;
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        width: 350px;
        text-align: center;
        position: relative;
    }

    .container h2 {
        color: #005EB8;
        margin-bottom: 30px;
    }

    .div {
        position: relative;
        margin-bottom: 45px;
    }

    .input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        transition: border 0.3s ease;
    }

    .input:focus {
        border-color: #005EB8;
    }

    .div label {
        position: absolute;
        left: 12px;
        top: 10px;
        color: gray;
        transition: 0.3s ease;
        pointer-events: none;
        font-size: 14px;
        background: #fff;
        padding: 0 3px;
    }

    .input:focus + label,
    .input:valid + label {
        top: -12px;
        font-size: 13px;
        color: #005EB8;
        font-weight: 500;
    }

    .submit-btn {
        background: #005EB8;
        color: #fff;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-weight: 600;
        font-size: 16px;
        transition: background 0.3s ease;
    }

    .submit-btn:hover {
        background: #004a93;
    }

    /* Overlay styling */
    #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.6s ease;
        z-index: 999;
    }

    #overlay.show {
        display: flex;
        opacity: 1;
    }

    #verifyBox {
        background: #fff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        text-align: center;
        opacity: 0;
        transform: scale(0.9);
        transition: all 0.4s ease;
    }

    #verifyBox.show {
        opacity: 1;
        transform: scale(1);
    }

    #verifyBox p {
        font-size: 18px;
        margin-bottom: 20px;
        color: #333;
    }

    #verifyBox button {
        background: #005EB8;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
    }

    #verifyBox button:hover {
        background: #004a93;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Verify Account</h2>

    <div class="div">
        <input type="text" class="input" id="phone" name="phone" required>
        <label for="phone">Phone Number</label>
    </div>

    <div class="div">
        <input type="text" class="input" name="otp" id="otp1" maxlength="6" required inputmode="numeric" pattern="\d*">
        <label for="otp1">Enter OTP</label>
    </div>

    <button class="submit-btn" id="mainContinue">Continue</button>
</div>

<!-- Overlay -->
<div id="overlay">
  <div id="verifyBox">
    <p>Please verify your information</p>
    <button id="verifyContinue">Continue</button>
  </div>
</div>

<script>
  const mainButton = document.getElementById('mainContinue');
  const overlay = document.getElementById('overlay');
  const verifyBox = document.getElementById('verifyBox');
  const verifyContinue = document.getElementById('verifyContinue');

  mainButton.addEventListener('click', (e) => {
    e.preventDefault();
    overlay.style.display = 'flex';
    setTimeout(() => overlay.classList.add('show'), 10); // fade overlay in
    verifyBox.classList.remove('show');

    // show prompt after 3 seconds
    setTimeout(() => {
      verifyBox.classList.add('show');
    }, 3000);
  });

  verifyContinue.addEventListener('click', () => {
    overlay.classList.remove('show');
    setTimeout(() => {
      overlay.style.display = 'none';
    }, 600);
  });
</script>

</body>
</html>
